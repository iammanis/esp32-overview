name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  # Validate the build on every pull request, whatever the branch is called.
  # The deploy job is gated on main, so pull requests build without deploying.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0
  # Used only if actions/configure-pages cannot report the real base URL.
  # Must match the custom domain configured in Settings -> Pages.
  FALLBACK_BASE_URL: https://esp32.iammanis.com

jobs:
  build:
    name: Build with Hugo
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo (extended)
        run: |
          set -euo pipefail
          curl -sSLo hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Tries to enable Pages automatically. If the token isn't allowed to create the
      # Pages site, this step is allowed to fail and the build falls back to the
      # baseURL in hugo.toml — so the build and artifact still get validated, and the
      # deploy job starts working as soon as Pages is enabled in Settings.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: UTC
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          BASE="${PAGES_BASE_URL:-}"
          if [ -z "$BASE" ]; then
            BASE="$FALLBACK_BASE_URL"
            echo "::warning::Pages base_url unavailable; falling back to $BASE"
          fi
          BASE="${BASE%/}"

          # actions/configure-pages reports http:// until "Enforce HTTPS" is enabled in
          # Settings -> Pages. Absolute URLs baked into the build (canonical, og:url,
          # sitemap, RSS) should be https regardless, so normalise the scheme here.
          BASE=$(printf '%s' "$BASE" | sed -E 's#^http://#https://#')

          echo "Building with baseURL ${BASE}/"
          hugo --gc --minify --baseURL "${BASE}/"

          # Hand the resolved base URL to the verify step.
          echo "SITE_BASE_URL=${BASE}" >> "$GITHUB_ENV"

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/variants/index.html
          test -f public/variants/esp32-c6/index.html

          pages=$(find public -name 'index.html' | wc -l)
          echo "Generated $pages pages."
          if [ "$pages" -lt 20 ]; then
            echo "::error::Expected at least 20 pages, found $pages"
            exit 1
          fi

          # Guard the link render hook against regression. The correct prefix depends on
          # how the site is served, so derive it from the base URL rather than hardcoding:
          #   custom domain (esp32.iammanis.com)      -> served at the root, prefix is empty
          #   project site (…github.io/esp32-overview) -> prefix is /esp32-overview
          PREFIX=$(printf '%s' "$SITE_BASE_URL" | sed -E 's#^[a-zA-Z]+://[^/]+##; s#/+$##')
          echo "Expected internal link prefix: '${PREFIX:-<site root>}'"

          links=$(grep -rhoE 'href="/[^"]*"|href=/[^ >]*' public --include='*.html' \
                  | sed -E 's/^href="?//; s/"$//' | sort -u)

          if [ -n "$PREFIX" ]; then
            # Serving from a subdirectory: every root-relative link must start with it.
            bad=$(printf '%s\n' "$links" | grep -vE "^${PREFIX}/" || true)
            problem="root-relative links missing the ${PREFIX} prefix"
          else
            # Serving from the root: flag protocol-relative links and any stale subpath.
            bad=$(printf '%s\n' "$links" | grep -E '^//|^/esp32-overview(/|$)' || true)
            problem="malformed or stale-subpath links"
          fi

          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Found $problem (see above)"
            exit 1
          fi
          echo "All internal links resolve against the configured base URL."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # The github-pages environment's branch policy only permits deployments from main,
    # so on feature branches run the build for validation and skip the deploy rather
    # than letting it fail on a protection rule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
