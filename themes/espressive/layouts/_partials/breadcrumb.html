<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="{{ "" | relURL }}">Home</a>
  {{- $p := . -}}
  {{- with .Parent -}}
    {{- if not .IsHome -}}
      <span aria-hidden="true">/</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{- end -}}
  {{- end -}}
  <span aria-hidden="true">/</span><span class="current">{{ .Title }}</span>
</nav>
