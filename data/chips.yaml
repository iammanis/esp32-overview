# Master data for every current Espressif ESP32-family SoC.
#
# Sources: Espressif product pages and the SoC selector (espressif.com/en/products/socs),
# the ESP-Techpedia board-selection comparison, and the individual series datasheets on
# documentation.espressif.com. Verified September 2026. See /sources/ for detail.
#
# priceFrom  = Espressif's published "sample price for reference" for the cheapest orderable
#              part number in the series, in USD. Indicative only, not a quote.
# status     = production | sampling | co-processor
# group      = which family block the chip belongs to on the site

groups:
  - id: classic
    name: The original and the S-series
    blurb: >-
      General-purpose and multimedia parts. The original ESP32 and the S-series use Espressif's
      Xtensa cores; the brand-new S31 moves the line to RISC-V. This is where you go for lots of
      GPIO, displays, cameras and USB.
  - id: c
    name: The C-series
    blurb: >-
      Cost- and power-optimised RISC-V parts. Small packages, small pin counts, modern radios and
      the lowest prices in the family. The volume workhorses for connected sensors and appliances.
  - id: h
    name: The H-series
    blurb: >-
      Wi-Fi removed on purpose. Bluetooth LE plus 802.15.4 for Thread, Zigbee and Matter, tuned for
      single-digit microamp sleep currents and years of battery life.
  - id: p
    name: The P-series
    blurb: >-
      The radio removed instead. Raw application performance, MIPI display and camera interfaces,
      hardware video codecs and high-speed USB. Pair one with a C-series chip for connectivity.
  - id: e
    name: The E-series
    blurb: >-
      Not a microcontroller. A radio co-processor that hangs off a Linux host over PCIe, SDIO or
      USB and takes over the entire Wi-Fi and Bluetooth stack.

